name: Validate theme

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install lint dependencies
        run: npm ci

      - name: Validate manifest.json and variants/*.json
        run: npm run validate

      - name: Lint theme.css
        run: npm run lint:css

      - name: Lint theme.css against Obsidian's theme review rules
        run: npm run lint:obsidian-review
